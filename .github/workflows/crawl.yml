# Automatic crawl ~every 5 minutes — wakes the Vercel API and runs one cycle.
#
# IMPORTANT (GitHub limitation):
# - `schedule` is NOT exact. Jobs are often delayed or dropped under load.
# - `workflow_dispatch` (manual) can succeed while `schedule` looks idle.
# - High load is worst near minute 0 of each hour — we offset minutes below.
# - Docs: https://docs.github.com/en/actions/how-tos/troubleshoot-workflows
#
# Required repo Actions variable (plain, not secret):
#   CRAWL_API_BASE_URL = https://your-backend.vercel.app   (no trailing slash)
name: Crawl every 5 minutes

on:
  schedule:
    # ~every 5 min, offset from :00/:05/... to reduce drop risk
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch: {}

concurrency:
  group: crawl-scheduled
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger API crawl
        env:
          CRAWL_API_BASE_URL: ${{ vars.CRAWL_API_BASE_URL }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          echo "Triggered by: ${EVENT_NAME}"
          if [ -z "${CRAWL_API_BASE_URL:-}" ]; then
            echo "Missing variable CRAWL_API_BASE_URL"
            echo "GitHub → Settings → Secrets and variables → Actions → Variables → New repository variable"
            exit 1
          fi
          url="${CRAWL_API_BASE_URL%/}/api/crawl/run"
          echo "POST $url"
          curl -fsS -X POST --max-time 120 "$url" | python3 -m json.tool
