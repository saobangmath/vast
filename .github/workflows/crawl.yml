# Automatic crawl every 5 minutes — wakes the Vercel API and runs one cycle.
# Required repo Actions variable (plain, not secret):
#   CRAWL_API_BASE_URL = https://your-backend.vercel.app   (no trailing slash)
name: Crawl every 5 minutes

on:
  schedule:
    - cron: "*/5 * * * *" # every 5 minutes (UTC)
  workflow_dispatch: {}

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger API crawl
        env:
          CRAWL_API_BASE_URL: ${{ vars.CRAWL_API_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CRAWL_API_BASE_URL:-}" ]; then
            echo "Missing variable CRAWL_API_BASE_URL"
            echo "GitHub → Settings → Secrets and variables → Actions → Variables → New repository variable"
            exit 1
          fi
          url="${CRAWL_API_BASE_URL%/}/api/crawl/run"
          echo "POST $url"
          curl -fsS -X POST --max-time 120 "$url" | python3 -m json.tool
