# Automatic crawl every hour — wakes the Vercel API and runs one cycle.
# Required repo secret:
#   CRAWL_API_BASE_URL = https://your-backend.vercel.app   (no trailing slash)
name: Crawl hourly

on:
  schedule:
    - cron: "0 * * * *" # every hour at minute 0 (UTC)
  workflow_dispatch: {}

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger API crawl
        env:
          CRAWL_API_BASE_URL: ${{ secrets.CRAWL_API_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CRAWL_API_BASE_URL:-}" ]; then
            echo "Missing secret CRAWL_API_BASE_URL"
            echo "GitHub → Settings → Secrets and variables → Actions → New secret"
            exit 1
          fi
          url="${CRAWL_API_BASE_URL%/}/api/crawl/run"
          echo "POST $url"
          curl -fsS -X POST --max-time 120 "$url" | python3 -m json.tool
