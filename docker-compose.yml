services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vast
      POSTGRES_PASSWORD: vast
      POSTGRES_DB: vast_news
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vast -d vast_news"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://vast:vast@db:5432/vast_news
      CORS_ORIGINS: http://localhost:3000
      CRAWL_SCHEDULER_ENABLED: "true"
      CRAWL_INTERVAL_SECONDS: "300"
      CRAWL_ON_STARTUP: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
