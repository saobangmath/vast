# Deploy API + periodic crawl on Render (free-friendly).
# 1) Create a Neon Postgres DB and paste DATABASE_URL below in the Render dashboard
#    (or set it when prompted — sync: false means you fill it in the UI).
# 2) After deploy, set CORS_ORIGINS to your Vercel URL, e.g. https://your-app.vercel.app
# 3) Point Vercel NEXT_PUBLIC_API_URL to this service URL.

services:
  - type: web
    name: vast-khcn-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CRAWL_SCHEDULER_ENABLED
        value: "true"
      - key: CRAWL_INTERVAL_SECONDS
        value: "300"
      - key: CRAWL_ON_STARTUP
        value: "true"

  # Keeps free-tier web service warm and triggers crawl every 5 minutes
  - type: cron
    name: vast-khcn-crawl-cron
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    schedule: "*/5 * * * *"
    dockerCommand: python -c "import os,urllib.request; b=os.environ['API_BASE_URL'].rstrip('/'); b=b if b.startswith('http') else 'https://'+b; u=b+'/api/crawl/run'; print(urllib.request.urlopen(urllib.request.Request(u,method='POST'),timeout=120).status)"
    envVars:
      - key: API_BASE_URL
        fromService:
          type: web
          name: vast-khcn-api
          property: host
